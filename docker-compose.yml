services:
  postgres:
    image: postgres:16-alpine
    container_name: eightchat_postgres
    environment:
      POSTGRES_DB: eightchat
      POSTGRES_USER: eightchat
      POSTGRES_PASSWORD: eightchat_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eightchat -d eightchat"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eightchat_redis
    command: redis-server --appendonly yes --requirepass eightchat_redis_secret
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "eightchat_redis_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
